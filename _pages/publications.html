<!-- inline dropdown demo -->
<style>
  .pub-links {
    white-space: nowrap;
    font-family: sans-serif;
  }

  .inline-details {
    display: inline-block;
    margin: 0;
    padding: 0;
    vertical-align: middle;
  }

  .inline-details summary {
    display: inline;
    cursor: pointer;
    color: #52ADC8;
    text-decoration: underline;
    list-style: none;
  }

  .inline-details summary::-webkit-details-marker {
    display: none;
  }

  .inline-details div {
    background: #f5f5f5;
    border: 1px solid #ccc;
    padding: 0.5em;
    margin-top: 0.3em;
  }
</style>

<p class="pub-links">
  <a href="#">ABS</a>&nbsp;|&nbsp;
  <a href="#">PDF</a>&nbsp;|&nbsp;
  <details class="inline-details">
    <summary>DOI</summary>
    <div><a href="https://doi.org/10.1234/example">https://doi.org/10.1234/example</a></div>
  </details>
</p>
